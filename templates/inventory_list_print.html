<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Printable Inventory List</title>

    <style>

    body{
        font-family: Arial, sans-serif;
        padding:20px;
        color:#333;
    }

    h1{
        text-align:center;
        color:#003366;
        margin-bottom:20px;
    }

    table{
        width:100%;
        border-collapse:collapse;
    }

    th{
        background:#003366;
        color:white;
    }

    th,
    td{
        border:1px solid #cccccc;
        padding:10px;
        text-align:left;
    }

    tr:nth-child(even){
        background:#f5f5f5;
    }

    .print-date{
        text-align:right;
        margin-bottom:15px;
        font-size:12px;
        color:#666;
    }

    @media print{

        body{
            padding:0;
        }

        h1{
            color:black;
        }

    }

    </style>

</head>

<body>

    <div class="print-date">

        Printed on:
        <script>
            document.write(
                new Date().toLocaleDateString()
            );
        </script>

    </div>

    <div class="report-header">

        <img
            src="{{ url_for(
                'static',
                filename='images/rh_logo.png'
            ) }}"
            alt="Company Logo"
            class="company-logo">

        <h1>
            Appliance Inventory Report
        </h1>

    </div>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Product Name</th>
                <th>Brand</th>
                <th>Model</th>
                <th>Price</th>
                <th>Category</th>
                <th>Condition</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>

        {% for item in inventory %}
            <tr>
                <td>{{ item[0] }}</td>
                <td>{{ item[1] }}</td>
                <td>{{ item[2] }}</td>
                <td>{{ item[3] }}</td>
                <td>${{ item[4] }}</td>
                <td>{{ item[5] }}</td>
                <td>{{ item[6] }}</td>
                <td>{{ item[8] }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>

    <script>
        window.onload = function(){
            window.print();
        };
    </script>

</body>
</html>
