<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Dashboard</title>

    <style>

    body{
        font-family:Arial, sans-serif;
        background:#f4f4f4;
        padding:30px;
    }

    .container{
        max-width:1000px;
        margin:auto;
    }

    h1{
        color:#003366;
        margin-bottom:20px;
    }

    .card{
        background:white;
        padding:20px;
        border-radius:10px;
        margin-bottom:20px;
        box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    .inventory-grid{
        display:grid;
        grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
        gap:20px;
    }

    .inventory-item{
        border:1px solid #ddd;
        border-radius:10px;
        overflow:hidden;
        background:white;
    }

    .inventory-item img{
        width:100%;
        height:180px;
        object-fit:cover;
    }

    .inventory-item h3{
        padding:10px;
        text-align:center;
    }

    .delete-btn{
        display:block;
        width:100%;
        padding:10px;
        border:none;
        background:#cc0000;
        color:white;
        cursor:pointer;
    }

    .upload-btn{
        background:#ff6600;
        color:white;
        padding:12px 20px;
        border:none;
        border-radius:5px;
        cursor:pointer;
    }

    </style>
</head>

<body>

<div class="container">

    <h1>Inventory Dashboard</h1>

    <div class="card">

        <h2>Upload New Appliance Photo</h2>

        <input type="file" id="imageInput">

        <br><br>

        <button class="upload-btn">
            Upload Appliance
        </button>

    </div>

    <div class="card">

        <h2>Current Inventory</h2>

        <div class="inventory-grid">

            <div class="inventory-item">
                <img src="../images/refrigerator.jpg">
                <h3>Refrigerator</h3>
                <button class="delete-btn">Delete</button>
            </div>

            <div class="inventory-item">
                <img src="../images/washing_machine.jpg">
                <h3>Washer</h3>
                <button class="delete-btn">Delete</button>
            </div>

            <div class="inventory-item">
                <img src="../images/oven.jpg">
                <h3>Oven</h3>
                <button class="delete-btn">Delete</button>
            </div>

        </div>

    </div>

</div>

</body>
</html>
