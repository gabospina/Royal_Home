<body>

<div class="container">

<div class="card">

<a
    href="/dashboard"
    class="inventory-btn">

    Return to Dashboard
</a>
<a
    href="/logout"
    class="inventory-btn">
    Logout
</a>


<br><br>

<h1>Edit Appliance</h1>

<form
    method="POST"
    action="/update/{{ item[0] }}">

    <div class="form-row">

        <div class="form-group">

            <label for="product_name">
                Product Name
            </label>

            <input
                type="text"
                id="product_name"
                name="product_name"
                value="{{ item[1] if item[4] is not none else '' }}">

        </div>

        <div class="form-group">

            <label for="brand">
                Brand
            </label>

            <input
                type="text"
                id="brand"
                name="brand"
                value="{{ item[2] if item[4] is not none else '' }}">

        </div>

    </div>

    <div class="form-row">

        <div class="form-group">

            <label for="model">
                Model
            </label>

            <input
                type="text"
                id="model"
                name="model"
                value="{{ item[3] if item[4] is not none else '' }}">

        </div>

        <div class="form-group">

            <label for="price">
                Price
            </label>

            <input
                type="number"
                step="0.01"
                id="price"
                name="price"
                value="{{ item[4] if item[4] is not none else '' }}">

        </div>

    </div>

    <label for="category">
        Category
    </label>

    <select
        id="category"
        name="category">

        <option value="">
            -- Select Category --
        </option>

        <option value="Refrigerator" {% if item[5] == 'Refrigerator' %}selected{% endif %}>
            Refrigerator
        </option>

        <option value="Washer" {% if item[5] == 'Washer' %}selected{% endif %}>
            Washer
        </option>

        <option value="Dryer" {% if item[5] == 'Dryer' %}selected{% endif %}>
            Dryer
        </option>

        <option value="Oven" {% if item[5] == 'Oven' %}selected{% endif %}>
            Oven
        </option>

    </select>

    <br><br>

    <label for="condition">
        Condition
    </label>

    <textarea
        id="condition"
        name="condition">{{ item[6] }}</textarea>

    <br>

    <button
        class="save-btn"
        type="submit">

        Save Changes

    </button>

</form>

<div class="edit-photo">

{% if item[7] == 'no-image.png' %}

    <img
    src="{{ url_for(
        'static',
        filename='images/no-image.png'
    ) }}"
    alt="No Image">

    <div class="missing-photo">
        ⚠ Photo Needed
    </div>

{% else %}

    <img
    src="{{ url_for(
        'static',
        filename='images/uploads/' + item[7]
    ) }}"
    alt="{{ item[1] }}">

{% endif %}

</div>

</div>

</div>

</body>
