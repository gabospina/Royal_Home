<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Photo — {{ item[1] }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Upload Photo</h1>
        <h2>{{ item[1] }}</h2>
        <form method="POST"
              action="/upload-photo/{{ item[0] }}"
              enctype="multipart/form-data">
            <form method="POST" action="/restore/{{ item[0] }}"></form>  
            <label for="photo">Select Photo</label>
            <input type="file" id="photo" name="photo" accept="image/*" required>
            <button class="upload-btn" type="submit">Upload</button>
        </form>
        <br>
        <a href="/dashboard" class="inventory-btn">Return to Dashboard</a>
    </div>
</div>
</body>
</html>
